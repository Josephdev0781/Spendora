
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Image Carousel</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">My Image Carousel</h2>

    <div id="myCarousel"
         class="carousel slide"
         data-bs-ride="carousel">

        <!-- Image indicators -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#myCarousel"
                data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>

            <button type="button" data-bs-target="#myCarousel"
                data-bs-slide-to="1"
                aria-label="Slide 2"></button>

            <button type="button" data-bs-target="#myCarousel"
                data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>

        <!-- Carousel images -->
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="Assets/mountain.png"
                     class="d-block w-100"
                     alt="Mountain landscape">
                <div class="carousel-caption">
                    <h5>Beautiful Mountains</h5>
                    <p>Explore the beauty of nature.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="Assets/rivers.png"
                     class="d-block w-100"
                     alt="River and mountains">
                <div class="carousel-caption">
                    <h5>Peaceful Rivers</h5>
                    <p>Enjoy amazing natural scenery.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="Assets/forest.png"
                     class="d-block w-100"
                     alt="Forest landscape">
                <div class="carousel-caption">
                    <h5>Green Forests</h5>
                    <p>Discover the wonders of the outdoors.</p>
                </div>
            </div>

        </div>

        <!-- Previous button -->
        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#myCarousel"
                data-bs-slide="prev">
            <span class="carousel-control-prev-icon"
                  aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>

        <!-- Next button -->
        <button class="carousel-control-next"
                type="button"
                data-bs-target="#myCarousel"
                data-bs-slide="next">
            <span class="carousel-control-next-icon"
                  aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>

    </div>
</div>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
