<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/register.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
</head>
<body style="background-image:url('Assets/image.png'); background-size:cover;">
    

    <form>
        <legend>Join us today</legend> <br>

        <label for="name">FullName</label>
        <input type="text" id="name"  placeholder="Enter your name here!." required> <br><br>

        <label for="email">Email Address</label>
        <input type="email" id="email"  placeholder="abc@gmail.com" required> <br><br>

        <label for="pwd">Password</label>
        <input type="password" id="pwd"  placeholder="minimum 6 characters" required> <br><br>

        <label for="yob">Date of Birth</label>
        <input type="date" id="yob" required><br><br>

        <label for="dt">Date and Time</label>
        <input type="datetime-local" id="dt" required><br><br>

        <label for="phone">Phone No</label>
        <input type="tel" id="phone" required><br><br>

        <label for="file">Upload Now</label>
        <input type="file" id="file"><br><br>



        <label for="yos">Year of Study</label>
        <select>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
        </select><br><br>

        <button>Register</button>


        
    </form>
</body>
</html>
